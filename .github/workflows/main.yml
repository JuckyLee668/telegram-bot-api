on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            g++ \
            zlib1g-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            gperf \
            ninja-build \
            pkg-config\
            make\
            git \
            zlib1g-dev\
            libssl-dev gperf cmake clang-14 \
            libc++-14-dev \
            libc++abi-14-dev

      - name: Set version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="git-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure & build
        run: |
          ls
          rm -rf build
          mkdir -p build
          cd build
          ls
          CXXFLAGS="-stdlib=libc++" CC=/usr/bin/clang-14 CXX=/usr/bin/clang++-14 cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build .
          
      - name: Configure AWS CLI for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # 配置 AWS CLI 以使用 R2 的 S3 兼容端点
          aws configure set aws_access_key_id $R2_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $R2_SECRET_ACCESS_KEY
          aws configure set default.region auto
          # R2 的 S3 API 端点格式
          R2_ENDPOINT_URL="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "R2 Endpoint: $R2_ENDPOINT_URL"

      - name: Upload Files to R2 Bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd build
          R2_ENDPOINT_URL="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # 上传当前目录下所有文件到 R2 存储桶根目录
          for file in *; do
            if [ -f "$file" ]; then
              echo "Uploading $file to R2..."
              aws s3 cp "$file" "s3://$R2_BUCKET_NAME/" --endpoint-url="$R2_ENDPOINT_URL"
            fi
          done
          echo "✅ All files uploaded to R2."
