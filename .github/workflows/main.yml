name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'release*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            executable: telegram-bot-api
            artifact_suffix: linux-x86_64
            build_jobs: 3
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            executable: telegram-bot-api
            artifact_suffix: linux-arm64
            build_jobs: 2
          - os: windows-2022
            platform: windows
            arch: x86_64
            executable: telegram-bot-api.exe
            artifact_suffix: windows-x86_64
            build_jobs: 3
          - os: macos-13
            platform: macos
            arch: x86_64
            executable: telegram-bot-api
            artifact_suffix: macos-x86_64
            build_jobs: 3
          - os: macos-14
            platform: macos
            arch: arm64
            executable: telegram-bot-api
            artifact_suffix: macos-arm64
            build_jobs: 2
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            zlib1g-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            gperf \
            ninja-build \
            pkg-config \
            clang-14 \
            libc++-14-dev \
            libc++abi-14-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gperf openssl cmake ninja

      - name: Setup MSYS2 (Windows dependencies)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gperf

      - name: Configure & build (Linux x86_64)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang-14 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-14 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build --target telegram-bot-api --parallel ${{ matrix.build_jobs }}

      - name: Configure & build (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target telegram-bot-api --parallel ${{ matrix.build_jobs }}

      - name: Configure & build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target telegram-bot-api --parallel ${{ matrix.build_jobs }}

      - name: Configure & build (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target telegram-bot-api --parallel ${{ matrix.build_jobs }}

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/${{ matrix.executable }} dist/telegram-bot-api-${{ github.ref_name }}-${{ matrix.artifact_suffix }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/${{ matrix.executable }} dist/telegram-bot-api-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-${{ matrix.artifact_suffix }}
          path: dist/*
          if-no-files-found: error

  upload-to-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
