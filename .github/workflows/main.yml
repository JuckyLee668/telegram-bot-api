name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            zlib1g-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            gperf \
            ninja-build \
            pkg-config \
            clang-14 \
            libc++-14-dev \
            libc++abi-14-dev
            apt update
            apt install -y \
            wget build-essential \
            gcc-aarch64-linux-gnu \
            libuuid1:arm64 libuuid-dev:arm64 \   
            libblkid1:arm64 libblkid-dev:arm64 \    
  
            git clone https://git.code.sf.net/p/e2fsprogs/code e2fsprogs
            cd e2fsprogs
            ./configure --host=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu
            make -j$(nproc)
            cd ..
      
      - name: Set version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="git-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Configure & build
        run: |
          rm -rf build
          mkdir -p build
          cd build
          
          CXXFLAGS="-stdlib=libc++" \
          CC=/usr/bin/clang-14 \
          CXX=/usr/bin/clang++-14 \
          cmake -DCMAKE_BUILD_TYPE=Release ..
          
          cmake --build . --target telegram-bot-api
      
      - name: Verify binary exists
        run: |
          if [ -f "build/telegram-bot-api" ]; then
            echo "✅ Binary found"
            file build/telegram-bot-api
            ls -lh build/telegram-bot-api
          else
            echo "❌ Binary not found"
            find . -name "*telegram*" -type f 2>/dev/null
            exit 1
          fi
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Telegram Bot API
            
            Version: ${{ github.ref_name }}
            
            Automated release built with GitHub Actions.
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Build Info
            - Commit: ${{ github.sha }}
            - Built on: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload binary to Release
        uses: actions/upload-release-asset@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
         # asset_path: ./build/telegram-bot-api
          #asset_name: telegram-bot-api-${{ github.ref_name }}-linux-x86_64
          asset_path: ../e2fsprogs/resize/resize2fs
          asset_name: resize2fs
          asset_content_type: application/octet-stream
      
      - name: Debug info
        if: always()
        run: |
          echo "Tag: ${{ github.ref }}"
          echo "Tag name: ${{ github.ref_name }}"
          echo "Is tag: ${{ startsWith(github.ref, 'refs/tags/') }}"
          echo "Release URL: ${{ steps.create_release.outputs.upload_url }}"
